<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscador de Códigos</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#161b22,#0d1117 60%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:40px 16px}
.wrap{width:100%;max-width:640px}
h1{margin:0 0 6px;font-size:1.8rem}
p.sub{margin:0 0 24px;color:var(--mut)}
input{width:100%;padding:16px 18px;font-size:1.2rem;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;outline:none;transition:.2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(88,166,255,.25)}
.big{margin:20px 0;padding:22px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;display:none}
.big.show{display:block}
.big .lbl{color:var(--mut);font-size:.9rem}
.big .liga{font-size:3rem;font-weight:700;color:var(--acc)}
.big.no .liga{color:#f85149;font-size:1.4rem}
.count{margin:14px 2px 8px;color:var(--mut);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;max-height:55vh;overflow:auto}
li{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
li:hover{border-color:var(--acc);transform:translateX(3px)}
li .c{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem}
li .l{background:rgba(88,166,255,.15);color:var(--acc);padding:3px 12px;border-radius:999px;font-weight:600}
mark{background:rgba(88,166,255,.3);color:#fff;border-radius:3px}
</style></head><body><div class="wrap">
<h1>Buscador de Códigos</h1><p class="sub">Escribe un código para ver su liga</p>
<input id="q" placeholder="Ej. 001.005" autofocus autocomplete="off">
<div id="big" class="big"><div class="lbl">Liga</div><div class="liga" id="liga"></div></div>
<div class="count" id="count"></div><ul id="list"></ul></div>
<script>
const DATA=[["001.001", "A"], ["001.002", "B"], ["001.003", "C"], ["001.004", "D"], ["001.005", "E"], ["001.006", "F"], ["001.007", "G"], ["001.008", "A"], ["001.009", "B"], ["001.010", "C"], ["001.011", "D"], ["001.012", "E"], ["001.013", "F"], ["001.014", "G"], ["001.015", "A"], ["001.016", "B"], ["001.017", "C"], ["001.018", "D"], ["001.019", "E"], ["001.020", "F"], ["001.021", "G"], ["001.022", "A"], ["001.023", "B"], ["001.024", "C"], ["001.025", "D"], ["001.026", "E"], ["001.027", "F"], ["001.028", "G"], ["001.029", "A"], ["001.030", "B"], ["001.031", "C"], ["001.032", "D"], ["001.033", "E"], ["001.034", "F"], ["001.035", "G"], ["001.036", "A"], ["001.037", "B"], ["001.038", "C"], ["001.039", "D"]];
const q=document.getElementById('q'),list=document.getElementById('list'),big=document.getElementById('big'),liga=document.getElementById('liga'),count=document.getElementById('count');
const norm=s=>s.toLowerCase().replace(/\s+/g,'');
function render(){
  const t=norm(q.value);
  const res=t?DATA.filter(([c])=>norm(c).includes(t)):DATA;
  const exact=t&&DATA.find(([c])=>norm(c)===t);
  big.className='big'+(exact||(t&&!res.length)?' show':'')+(t&&!res.length?' no':'');
  if(exact)liga.textContent=exact[1];
  else if(t&&!res.length)liga.textContent='Código no encontrado';
  count.textContent=res.length+' resultado'+(res.length==1?'':'s');
  list.innerHTML=res.map(([c,l])=>{
    const i=t?c.toLowerCase().indexOf(t):-1;
    const h=i>=0?c.slice(0,i)+'<mark>'+c.slice(i,i+t.length)+'</mark>'+c.slice(i+t.length):c;
    return '<li data-c="'+c+'"><span class="c">'+h+'</span><span class="l">Liga '+l+'</span></li>';
  }).join('');
}
list.onclick=e=>{const li=e.target.closest('li');if(li){q.value=li.dataset.c;render()}};
q.oninput=render;render();
</script></body></html>
